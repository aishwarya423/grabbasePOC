[package]
name = "rest"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1

[dependencies]
grafbase-sdk = "0.23.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
grafbase-sdk = { version = "0.23.1", features = ["test-utils"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
serde_json = "1"